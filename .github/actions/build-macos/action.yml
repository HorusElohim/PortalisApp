name: Build macOS (Portalis)
description: >-
  Build macOS app; when a Developer ID cert is configured, sign and notarize
  it so Gatekeeper accepts it on someone else's Mac. Falls back to an
  unsigned build otherwise.
inputs:
  working-dir:
    description: Path to Flutter project
    required: false
    default: portalis
  developer-id-cert-base64:
    description: >-
      Base64-encoded Developer ID Application certificate (.p12). Empty
      skips signing/notarization, producing only an unsigned build.
    required: false
    default: ''
  developer-id-cert-password:
    description: Password the .p12 was exported with.
    required: false
    default: ''
  asc-api-key-base64:
    description: Base64-encoded App Store Connect API key (.p8), for notarytool.
    required: false
    default: ''
  asc-api-key-id:
    description: App Store Connect API key ID
    required: false
    default: ''
  asc-api-issuer-id:
    description: App Store Connect API issuer ID (UUID)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Compute metadata
      id: meta
      shell: bash
      run: |
        echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        echo "run_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
    - name: Toolchains
      id: setup
      uses: ./.github/actions/setup-flutter-rust
      with:
        extract-version: 'true'
        extract-backend-version: 'true'
        working-dir: ${{ inputs.working-dir }}

    - name: Import Developer ID certificate into a temporary keychain
      id: signing
      if: ${{ inputs.developer-id-cert-base64 != '' }}
      shell: bash
      run: |
        set -euo pipefail
        # A dedicated keychain, not the runner's default login keychain: it
        # is created and destroyed entirely within this job, so nothing
        # about the signing identity outlives the run that used it.
        keychain="portalis-signing.keychain-db"
        keychain_password="$(openssl rand -base64 24)"
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"

        cert_path="$RUNNER_TEMP/developer_id.p12"
        echo "${{ inputs.developer-id-cert-base64 }}" | base64 -d > "$cert_path"
        security import "$cert_path" -k "$keychain" -P "${{ inputs.developer-id-cert-password }}" \
          -T /usr/bin/codesign -T /usr/bin/security
        rm -f "$cert_path"
        security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"

        # Make it findable without forcing it onto the runner's default
        # search path, and make sure it is dropped from the search list too.
        existing=$(security list-keychains -d user | tr -d '"')
        security list-keychains -d user -s "$keychain" $existing

        identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
        if [[ -z "$identity" ]]; then
          echo "::error::No 'Developer ID Application' identity found in the imported certificate." >&2
          exit 1
        fi
        echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
        echo "identity=$identity" >> "$GITHUB_OUTPUT"
        echo "has_cert=true" >> "$GITHUB_OUTPUT"

    - name: Install App Store Connect API key (for notarytool)
      if: ${{ steps.signing.outputs.has_cert == 'true' && inputs.asc-api-key-base64 != '' }}
      shell: bash
      run: |
        set -euo pipefail
        key_dir="$HOME/.appstoreconnect/private_keys"
        mkdir -p "$key_dir"
        echo "${{ inputs.asc-api-key-base64 }}" | base64 -d > "$key_dir/AuthKey_${{ inputs.asc-api-key-id }}.p8"

    - name: Flutter build macOS
      shell: bash
      working-directory: ${{ inputs.working-dir }}
      run: flutter build macos --release

    - name: Sign, notarize, and staple
      if: ${{ steps.signing.outputs.has_cert == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-dir }}
      run: |
        set -euo pipefail
        app="build/macos/Build/Products/Release/portalis.app"

        codesign --force --deep --options runtime \
          --sign "${{ steps.signing.outputs.identity }}" \
          --keychain "${{ steps.signing.outputs.keychain }}" \
          "$app"
        codesign --verify --deep --strict --verbose=2 "$app"

        zip_path="$RUNNER_TEMP/portalis-notarize.zip"
        ditto -c -k --keepParent "$app" "$zip_path"

        if [[ -n "${{ inputs.asc-api-key-base64 }}" ]]; then
          xcrun notarytool submit "$zip_path" \
            --key "$HOME/.appstoreconnect/private_keys/AuthKey_${{ inputs.asc-api-key-id }}.p8" \
            --key-id "${{ inputs.asc-api-key-id }}" \
            --issuer "${{ inputs.asc-api-issuer-id }}" \
            --wait
          xcrun stapler staple "$app"
        else
          echo "::warning::No App Store Connect API key configured — app is signed but NOT notarized. Gatekeeper will still warn on first launch."
        fi

    - name: Remove signing keychain and API key
      if: always()
      shell: bash
      run: |
        [[ -n "${{ steps.signing.outputs.keychain }}" ]] && security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
        rm -rf "$HOME/.appstoreconnect"

    - name: Upload macOS app
      uses: actions/upload-artifact@v6
      with:
        name: >-
          Portalis-${{ steps.setup.outputs.backend-version }}-macOS-${{ steps.setup.outputs.app-version }}-${{ steps.meta.outputs.short_sha }}-release${{ steps.signing.outputs.has_cert == 'true' && '-notarized' || '-unsigned' }}
        path: ${{ inputs.working-dir }}/build/macos/Build/Products/Release/portalis.app
        retention-days: 1
