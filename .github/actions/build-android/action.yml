name: Build Android (Portalis)
description: Build Android JNI libs + APK and upload artifact
inputs:
  working-dir:
    description: Path to Flutter project
    required: false
    default: portalis
  keystore-base64:
    description: Base64-encoded release keystore (.jks).
    required: true
  keystore-password:
    description: Keystore/key password.
    required: true
  keystore-alias:
    description: Key alias inside the keystore.
    required: false
    default: 'portalis'
runs:
  using: composite
  steps:
    - name: Compute metadata
      id: meta
      shell: bash
      run: |
        echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        echo "run_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Toolchains
      id: setup
      uses: ./.github/actions/setup-flutter-rust
      with:
        rust-targets: >-
          aarch64-linux-android x86_64-linux-android armv7-linux-androideabi
        install-cargo-ndk: 'true'
        cache-key-suffix: android
        extract-version: 'true'
        extract-backend-version: 'true'
        working-dir: ${{ inputs.working-dir }}

    - name: Install release keystore
      shell: bash
      working-directory: ${{ inputs.working-dir }}
      run: |
        set -euo pipefail
        test -n "${{ inputs.keystore-base64 }}" || { echo "[ERROR] release keystore is required" >&2; exit 1; }
        test -n "${{ inputs.keystore-password }}" || { echo "[ERROR] release keystore password is required" >&2; exit 1; }
        echo "${{ inputs.keystore-base64 }}" | base64 -d > android/app/portalis-release.jks
        cat > android/key.properties <<EOF
        storePassword=${{ inputs.keystore-password }}
        keyPassword=${{ inputs.keystore-password }}
        keyAlias=${{ inputs.keystore-alias }}
        storeFile=portalis-release.jks
        EOF

    - name: Build Rust JNI libs (release)
      shell: bash
      working-directory: ${{ inputs.working-dir }}
      run: bash ./android/build_rust_android.sh release

    - name: Flutter build apk (release)
      shell: bash
      working-directory: ${{ inputs.working-dir }}
      run: flutter build apk --release

    - name: Verify release APK signer
      shell: bash
      working-directory: ${{ inputs.working-dir }}
      env:
        KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        KEYSTORE_ALIAS: ${{ inputs.keystore-alias }}
      run: |
        set -euo pipefail
        apk="build/app/outputs/flutter-apk/app-release.apk"
        expected=$(keytool -list -v -keystore android/app/portalis-release.jks \
          -alias "$KEYSTORE_ALIAS" -storepass "$KEYSTORE_PASSWORD" \
          -keypass "$KEYSTORE_PASSWORD" | awk -F': ' '/SHA256:/{print $2; exit}')
        apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)
        actual=$("$apksigner" verify --print-certs "$apk" | \
          awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}')
        test -n "$expected" && test "$expected" = "$actual" || {
          echo "[ERROR] release APK signer does not match the configured upload key" >&2
          exit 1
        }
        echo "release APK signer verified"

    - name: Remove release keystore
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-dir }}
      run: rm -f android/app/portalis-release.jks android/key.properties

    - name: Upload apk
      uses: actions/upload-artifact@v6
      with:
        name: Portalis-${{ steps.setup.outputs.backend-version }}-Android-${{ steps.setup.outputs.app-version }}-${{ steps.meta.outputs.short_sha }}-release
        path: ${{ inputs.working-dir }}/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 14
