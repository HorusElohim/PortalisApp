name: Build Android (Portalis)
description: Build Android JNI libs + APK and upload artifact
inputs:
  working-dir:
    description: Path to Flutter project
    required: false
    default: portalis
  keystore-base64:
    description: Base64-encoded release keystore (.jks).
    required: true
  keystore-password:
    description: Keystore/key password.
    required: true
  keystore-alias:
    description: Key alias inside the keystore.
    required: false
    default: 'portalis'
runs:
  using: composite
  steps:
    - name: Compute metadata
      id: meta
      shell: bash
      run: |
        echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        echo "run_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Toolchains
      id: setup
      uses: ./.github/actions/setup-flutter-rust
      with:
        rust-targets: aarch64-linux-android
        install-cargo-ndk: 'true'
        cache-key-suffix: android
        extract-version: 'true'
        extract-backend-version: 'true'
        working-dir: ${{ inputs.working-dir }}

    - name: Install release keystore
      shell: bash
      working-directory: ${{ inputs.working-dir }}
      env:
        KEYSTORE_BASE64: ${{ inputs.keystore-base64 }}
        KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        KEYSTORE_ALIAS: ${{ inputs.keystore-alias }}
      run: |
        set -euo pipefail
        test -n "$KEYSTORE_BASE64" || { echo "[ERROR] release keystore is required" >&2; exit 1; }
        test -n "$KEYSTORE_PASSWORD" || { echo "[ERROR] release keystore password is required" >&2; exit 1; }
        printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/portalis-release.jks
        test -s android/app/portalis-release.jks || { echo "[ERROR] decoded release keystore is empty" >&2; exit 1; }
        keytool -list -keystore android/app/portalis-release.jks \
          -alias "$KEYSTORE_ALIAS" \
          -storepass "$KEYSTORE_PASSWORD" >/dev/null || {
          echo "[ERROR] release keystore password or alias is invalid" >&2
          exit 1
        }
        printf '%s\n' \
          "storePassword=$KEYSTORE_PASSWORD" \
          "keyPassword=$KEYSTORE_PASSWORD" \
          "keyAlias=$KEYSTORE_ALIAS" \
          "storeFile=$(pwd)/android/app/portalis-release.jks" \
          > android/key.properties
        test -s android/key.properties || { echo "[ERROR] Android signing properties were not created" >&2; exit 1; }

    - name: Build Rust JNI libs (release)
      shell: bash
      working-directory: ${{ inputs.working-dir }}
      run: bash ./android/build_rust_android.sh release

    - name: Flutter build apk (release)
      shell: bash
      working-directory: ${{ inputs.working-dir }}
      run: |
        set -euo pipefail
        export ORG_GRADLE_PROJECT_portalisRequireReleaseSigning=true
        flutter build apk --release --target-platform android-arm64

    - name: Verify release APK signer
      shell: bash
      working-directory: ${{ inputs.working-dir }}
      env:
        KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        KEYSTORE_ALIAS: ${{ inputs.keystore-alias }}
      run: |
        set -euo pipefail
        apk="build/app/outputs/flutter-apk/app-release.apk"
        expected=$(keytool -exportcert -rfc \
          -keystore android/app/portalis-release.jks \
          -alias "$KEYSTORE_ALIAS" -storepass "$KEYSTORE_PASSWORD" \
          -keypass "$KEYSTORE_PASSWORD" | \
          openssl x509 -noout -fingerprint -sha256 | \
          cut -d= -f2 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
        apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)
        signer_output=$("$apksigner" verify --print-certs "$apk" 2>&1) || {
          echo "[ERROR] apksigner could not verify the release APK" >&2
          printf '%s\n' "$signer_output" >&2
          exit 1
        }
        actual=$(printf '%s\n' "$signer_output" | \
          grep -Eo '([[:xdigit:]]{2}:){31}[[:xdigit:]]{2}|[[:xdigit:]]{64}' | \
          head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]' || true)
        if test -z "$expected" || test -z "$actual" || test "$expected" != "$actual"; then
          echo "[ERROR] release APK signer does not match the configured upload key" >&2
          echo "[ERROR] expected certificate SHA-256: ${expected:-<missing>}" >&2
          echo "[ERROR] actual certificate SHA-256:   ${actual:-<missing>}" >&2
          if test -z "$actual"; then
            echo "[ERROR] apksigner output:" >&2
            printf '%s\n' "$signer_output" >&2
          fi
          exit 1
        fi
        echo "release APK signer verified: $actual"

    - name: Remove release keystore
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-dir }}
      run: rm -f android/app/portalis-release.jks android/key.properties

    - name: Upload apk
      uses: actions/upload-artifact@v6
      with:
        name: Portalis-${{ steps.setup.outputs.backend-version }}-Android-${{ steps.setup.outputs.app-version }}-${{ steps.meta.outputs.short_sha }}-release
        path: ${{ inputs.working-dir }}/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 14
