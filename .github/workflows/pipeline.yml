name: Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'portalis/**'
      - '.github/**'
      - 'tests/**'
      - 'doc/**'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'portalis/**'
      - '.github/**'
      - 'tests/**'
      - 'doc/**'
      - 'CHANGELOG.md'
      - 'AGENTS.md'

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKING_DIR: portalis
  # Nothing here is ever rebuilt incrementally — every job starts from a cold
  # or restored cache — so incremental artifacts are pure disk cost, and disk
  # is the thing this workspace runs out of.
  CARGO_INCREMENTAL: 0

jobs:
  backend:
    name: 🦀 Backend Nexus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The backend builds this workspace three times in one job — clippy,
      # then tests, then an instrumented coverage build that compiles every
      # crate twice again, with and without cfg(test). With iroh, ring and a
      # vendored librqbit underneath, that overran the runner's ~14 GB and
      # failed as "No space left on device" in whichever crate happened to be
      # compiling. None of what is removed here is used by any job.
      - name: Make room for the workspace
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: portalis/rust/backend
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Nexus backend checks
        run: ./tests/nexus.sh

  frontend:
    name: 🐦 Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchains
        uses: ./.github/actions/setup-flutter-rust
        with:
          install-frb-codegen: 'true'
          frb-codegen-version: '2.13.0'
      - name: Frontend checks
        run: ./tests/frontend.sh

  android:
    name: 🤖 Android
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v5
      - name: 🤖 Android
        uses: ./.github/actions/build-android
        with:
          keystore-base64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          keystore-alias: portalis

  linux:
    name: 🐧 Linux
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v5
      - name: 🐧 Linux
        uses: ./.github/actions/build-linux

  macos:
    name: 🍎 macOS
    runs-on: macos-latest
    needs: [backend, frontend]
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v5
      - name: 🍎 macOS
        uses: ./.github/actions/build-macos
        with:
          developer-id-cert-base64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 }}
          developer-id-cert-password: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          asc-api-key-base64: ${{ secrets.ASC_API_KEY_BASE64 }}
          asc-api-key-id: ${{ secrets.ASC_API_KEY_ID }}
          asc-api-issuer-id: ${{ secrets.ASC_API_ISSUER_ID }}

  ios:
    name: 📱 iOS (simulator)
    runs-on: macos-latest
    needs: [backend, frontend]
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v5
      - name: 📱 iOS
        uses: ./.github/actions/build-ios
        with:
          asc-api-key-base64: ${{ secrets.ASC_API_KEY_BASE64 }}
          asc-api-key-id: ${{ secrets.ASC_API_KEY_ID }}
          asc-api-issuer-id: ${{ secrets.ASC_API_ISSUER_ID }}

  windows:
    name: 🪟 Windows
    runs-on: windows-latest
    needs: [backend, frontend]
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v5
      - name: 🪟 Windows
        uses: ./.github/actions/build-windows

  summary:
    name: 🧾 Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, android, linux, macos, ios, windows]
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Extract app version
        id: version
        run: |
          set -euo pipefail
          fe_ver=$(grep -m1 '^version:' $WORKING_DIR/pubspec.yaml | awk '{print $2}')
          be_ver=$(awk -F '"' '/^version\s*=\s*"/ {print $2; exit}' $WORKING_DIR/rust/backend/Cargo.toml)
          echo "APP_VERSION=$fe_ver" >> $GITHUB_ENV
          echo "BACKEND_VERSION=$be_ver" >> $GITHUB_ENV
      - name: Summarize artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const runId = context.runId;
            const {owner, repo} = context.repo;
            const res = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id: runId});
            const arts = res.data.artifacts || [];
            // Build nice Markdown links with sizes
            const items = arts
              .sort((a,b) => a.name.localeCompare(b.name))
              .map(a => `<li><a href="${a.archive_download_url}">${a.name}</a> · ${(a.size_in_bytes/1024/1024).toFixed(2)} MB</li>`);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await core.summary
              .addHeading(`Portalis CI Summary`)
              .addRaw(`\n**Frontend:** ${process.env.APP_VERSION}\n`)
              .addRaw(`**Backend:** ${process.env.BACKEND_VERSION}\n\n`)
              .addRaw(`**Commit:** ${process.env.GITHUB_SHA.slice(0,7)}\n\n`)
              .addRaw(`**Run:** ${runUrl}\n\n`)
              .addHeading('Artifacts')
              .addRaw(items.length ? `<ul>\n${items.join('\n')}\n</ul>` : '<p>No artifacts found</p>')
              .write();
