# cargo-deny configuration for Portalis backend
# See https://github.com/EmbarkStudios/cargo-deny

[advisories]
# Fetch advisories from the RustSec database
# db-path = "advisories-db"  # optional: cache location
# Ignore specific advisories with justification
# Each entry needs: id = "RUSTSEC-YYYY-NNNN", reason = "..."
# ignore = []

# [bans]
# Disabled for now - too many duplicates from transitive deps
# multiple-versions = "deny"

# [licenses]
# Disabled for now - our own crates cause issues
# allow = [
#   "MIT",
#   "Apache-2.0",
