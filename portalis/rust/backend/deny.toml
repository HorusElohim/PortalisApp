# Explicit dependency policy for Portalis' Rust delivery gate.
# Keep this list reviewed: a newly introduced license must fail the gate.

[advisories]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/HorusElohim/rqbit",
  "https://github.com/HorusElohim/librqbit-dualstack-sockets",
]
unknown-registry = "deny"
unknown-git = "deny"

[bans]
# Several direct/transitive libraries intentionally use incompatible major
# versions (for example FRB versus librqbit). The dependency graph remains
# visible in CI; duplicate-version bans are not a safe release gate here.
multiple-versions = "allow"
