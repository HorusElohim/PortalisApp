#   "ISC",
#   "Zlib",
#   "Unicode-DFS-2016",
#   "Unicode-3.0",
#   "MPL-2.0",
#   "Apache-2.0 WITH LLVM-exception",
# ]

[sources]
# Only allow crates from crates.io and git repositories
# allow-unknown-registry = false
# allow-unknown-git = false

# Known registries we trust
# allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# known-git = []
# e.g. known-git = [{ repo = "https://github.com/example/repo" }]