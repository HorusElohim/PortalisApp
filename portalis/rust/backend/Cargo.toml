[package]
name = "backend"
version = "0.1.49"
edition = "2024"

[workspace]
resolver = "3"
members = [
    "crates/protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
blake3 = "1.8.2"
getrandom = "0.3.3"
futures-util = "0.3.33"
ed25519-dalek = "2.2.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
sha2 = "0.11.0"
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
prost = "0.14.4"
redb = "2.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
unicode-normalization = "0.1.25"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["v4", "v7"] }

portalis-nexus-protocol = { path = "crates/protocol" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"




[lib]
crate-type = ["cdylib", "staticlib", "rlib"]  # rlib is used by the local peer harness

[dependencies]
serde = { version = "1.0", features = ["derive"] }
flutter_rust_bridge = "=2.13.0"
tokio = { version = "1", features = ["rt"] }
anyhow = "1.0"
# Object-safe async methods, so a port can be an Arc<dyn Trait> and a test can
# swap it.
async-trait = "0.1"

portalis-nexus-protocol.workspace = true

# Iroh-free crypto extracted from the former Nexus client crate: sealing,
# opening, and chain verification for collections (see src/crypto.rs).
chacha20poly1305.workspace = true

# The local store (SPEC 13): one transactional file in the platform data
# directory. Pure Rust, so it cross-compiles to iOS and Android without a C
# toolchain to fight — which is what rules out the obvious alternative.
redb.workspace = true
thiserror.workspace = true

# Domain layer: device identity (signing) and content-addressing (rendezvous
# keys, manifest entry ids). Pure Rust, no OS-specific bits — safe on every
# target including wasm32.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
x25519-dalek = { version = "3", features = ["static_secrets"] }

# librqbit (BitTorrent engine) needs real OS sockets (via tokio/mio), which
# don't exist on wasm32 — Web is a viewer, not a swarm participant, so it's
# excluded there rather than gated behind a feature no wasm code path uses.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
bencode = { package = "librqbit-bencode", version = "9.0.1", default-features = false }
buffers = { package = "librqbit-buffers", version = "9.0.1" }
librqbit-core = { version = "9.0.1", default-features = false }
sha1w = { package = "librqbit-sha1-wrapper", version = "9.0.1", default-features = false, features = ["sha1-ring"] }
bytes = "1"
dirs = "6"
serde_json = "1.0"
# The manifest-sync mini-protocol (collab_sync.rs) needs real sockets and
# timeouts on top of the base `rt` feature — native targets only, same
# no-sockets-on-wasm32 reasoning as librqbit above.
# `sync` is Notify, which wakes the convergence loop on a user action. It
# compiles without it today only because librqbit happens to enable it.
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros", "sync"] }
# HTTPS remains available without AWS-LC's native iOS objects. reqwest leaves
# provider selection to the direct Rustls ring dependency below.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# UPnP port forwarding for the manifest-sync listener (librqbit forwards
# its own BT port via SessionOptions; this same crate — already in the
# tree as librqbit's dependency — lets us forward the sync port too, so
# the public-IP address embedded in invites is actually reachable on
# UPnP-enabled routers without manual port-forward setup).
librqbit-upnp = "9.0.1"
# Real interface enumeration for the addresses we advertise in invites.
# Already in the tree (librqbit depends on the same version), so this adds no
# compilation. Needed because inferring "our LAN address" from the default
# route is wrong whenever a VPN owns that route — see collab_sync::lan_ips.
network-interface = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "android")'.dependencies]
# Rust opens MediaStore/SAF descriptors itself; this is the narrow JNI bridge,
# not a Dart byte channel or a cache-file adapter.
jni = "0.22"

[build-dependencies]
cc = "1"

[patch.crates-io]
librqbit = { path = "../vendor/librqbit" }
librqbit-dualstack-sockets = { path = "../vendor/librqbit-dualstack-sockets" }
librqbit-sha1-wrapper = { path = "../vendor/librqbit-sha1-wrapper" }

# The domain layer's randomness (device keygen, invite secrets, collection
# ids) has no OS RNG to call into on wasm32 — route it through the browser's
# crypto API instead so the domain layer really is usable on every target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["v4", "js"] }
