[package]
name = "librqbit-sha1-wrapper"
version = "9.0.1"
edition = "2024"
license = "Apache-2.0"
description = "Common interface around portable SHA-1/SHA-256 implementations used in rqbit."

[features]
default = ["sha1-ring"]
sha1-crypto-hash = ["dep:crypto-hash"]
sha1-ring = ["dep:sha1", "dep:sha2"]

[lib]
name = "librqbit_sha1_wrapper"
path = "src/lib.rs"

[dependencies]
assert_cfg = "0.1"
crypto-hash = { version = "0.3", optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
