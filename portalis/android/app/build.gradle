plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android plugin.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing. `android/key.properties` is gitignored and holds the
// beta/production keystore credentials; it is absent on a fresh checkout and
// in CI runs that have not been given the keystore secret, so both fall back
// to debug signing rather than failing the build. That fallback produces an
// APK any device can still sideload — it is only unsuitable for the Play
// Store, which enforces upload-key continuity across releases.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def requireReleaseSigning = providers.gradleProperty("portalisRequireReleaseSigning").orNull == "true"
if (requireReleaseSigning && !hasReleaseKeystore) {
    throw new GradleException("release signing is required but android/key.properties is missing")
}
if (requireReleaseSigning && !file(keystoreProperties["storeFile"]).isFile()) {
    throw new GradleException("release signing is required but the configured keystore is missing")
}

android {
    namespace = "com.portalis"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        // flutter_local_notifications (added for transfer completion
        // feedback) ships Java 8+ APIs its AAR metadata requires desugaring
        // for; without this, :app:checkReleaseAarMetadata refuses the build.
        coreLibraryDesugaringEnabled = true
    }

    defaultConfig {
        applicationId = "com.portalis"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Local debug-compatible builds may fall back to debug signing,
            // but CI sets portalisRequireReleaseSigning and therefore cannot
            // silently produce an unsigned or debug-signed release artifact.
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            // Unset before this point: the release APK shipped every class
            // and every resource from every dependency verbatim, unshrunk.
            // shrinkResources requires minifyEnabled — see proguard-rules.pro
            // for what's kept beyond R8's own defaults (JNI native methods,
            // and every plugin's own bundled consumer-rules.pro, are already
            // covered automatically and don't need duplicating here).
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Required by coreLibraryDesugaringEnabled above.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}

// Build Rust shared libraries and place them in jniLibs before Android build.
def rustBuildScript = new File(rootProject.projectDir, "build_rust_android.sh")

tasks.register("buildRustAndroidRelease", Exec) {
    workingDir rootProject.projectDir
    commandLine "bash", rustBuildScript.absolutePath, "release"
    inputs.files(fileTree(dir: "${rootProject.projectDir}/../rust/backend/src"))
    inputs.files(file("${rootProject.projectDir}/../rust/backend/Cargo.toml"), file("${rootProject.projectDir}/../rust/backend/Cargo.lock"))
    outputs.dir(new File(projectDir, "src/main/jniLibs"))
}

tasks.register("buildRustAndroidDebug", Exec) {
    workingDir rootProject.projectDir
    commandLine "bash", rustBuildScript.absolutePath, "debug"
    inputs.files(fileTree(dir: "${rootProject.projectDir}/../rust/backend/src"))
    inputs.files(file("${rootProject.projectDir}/../rust/backend/Cargo.toml"), file("${rootProject.projectDir}/../rust/backend/Cargo.lock"))
    outputs.dir(new File(projectDir, "src/main/jniLibs"))
}

afterEvaluate {
    // Hook into variant preBuild so Rust libs exist before packaging.
    android.applicationVariants.all { variant ->
        def cap = variant.name.capitalize()
        if (variant.buildType.name == "release") {
            tasks.named("pre${cap}Build").configure { dependsOn(tasks.named("buildRustAndroidRelease")) }
        } else {
            tasks.named("pre${cap}Build").configure { dependsOn(tasks.named("buildRustAndroidDebug")) }
        }
    }
}
